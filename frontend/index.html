<!doctype html>
<html lang="zh-CN" data-theme="cyber">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xb_dm</title>

  <style>
    :root{color-scheme:dark;--bg:#05060d;--bg2:#080b16;--panel:rgba(10,20,40,.64);--border:rgba(0,240,255,.16);--text:#e6f5ff;--muted:#7c93b8;--primary:#00f0ff;--primary2:#2f6bff;--accent:#ff2e88;--success:#19f59a;--warn:#ffae00;--fill:255,255,255;--shadow:0 18px 42px rgba(0,0,0,.24);--grid:0,240,255;font-family:Inter,"Microsoft YaHei",system-ui,-apple-system,sans-serif}
    html[data-theme=anime]{color-scheme:light;--bg:#fdf3fb;--bg2:#eef3ff;--panel:rgba(255,255,255,.76);--border:rgba(126,142,232,.22);--text:#4a3a63;--muted:#a193bb;--primary:#5b9cff;--primary2:#8a7bff;--accent:#ff84bd;--success:#2bbf8f;--warn:#ff9f43;--fill:150,150,220;--shadow:0 18px 42px rgba(102,88,150,.14);--grid:150,150,220}
    html[data-theme=custom]{color-scheme:light;--bg:#fbfcff;--bg2:#eef7ff;--panel:rgba(238,247,255,.76);--border:rgba(79,140,255,.22);--text:#223047;--muted:#71809a;--primary:#4f8cff;--primary2:#2fc7a1;--accent:#ff7aa8;--success:#21b981;--warn:#f3a13b;--fill:34,48,71;--shadow:0 18px 42px rgba(50,80,130,.14);--grid:79,140,255}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;color:var(--text);background:linear-gradient(rgba(var(--grid),.055) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--grid),.055) 1px,transparent 1px),radial-gradient(circle at 15% 10%,color-mix(in srgb,var(--primary) 22%,transparent),transparent 32%),radial-gradient(circle at 86% 18%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 28%),linear-gradient(135deg,var(--bg),var(--bg2));background-size:34px 34px,34px 34px,auto,auto,auto} body.player-expanded{overflow:hidden} button,input,select{font:inherit}button{cursor:pointer}button:disabled,input:disabled{cursor:not-allowed;opacity:.55}main{width:min(1680px,calc(100% - 42px));min-height:100vh;margin:0 auto;padding:26px 0 36px}header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px}.headline{display:grid;gap:7px}h1,h2,h3,p{margin:0}h1{font-size:28px;letter-spacing:0}h2{font-size:17px}.sub,p{color:var(--muted);line-height:1.62}.badge{display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:0 11px;border:1px solid color-mix(in srgb,var(--success) 34%,transparent);border-radius:6px;color:var(--success);background:color-mix(in srgb,var(--success) 9%,transparent);font-size:12px;white-space:nowrap}.badge i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor}.toolbar{display:grid;grid-template-columns:minmax(150px,220px) minmax(220px,1fr) minmax(260px,340px) auto;gap:10px;margin-bottom:14px;padding:14px;border:1px solid var(--border);border-radius:8px;background:var(--panel);box-shadow:var(--shadow);backdrop-filter:blur(16px)}label{display:grid;gap:6px;color:var(--muted);font-size:12px}input,select{width:100%;min-height:40px;border:1px solid color-mix(in srgb,var(--primary) 22%,transparent);border-radius:6px;padding:0 11px;outline:0;color:var(--text);background:rgba(var(--fill),.045)}input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 14%,transparent)}.source-field{min-width:0}.source-segmented{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;min-height:40px;padding:4px;border:1px solid color-mix(in srgb,var(--primary) 22%,transparent);border-radius:8px;background:rgba(var(--fill),.045)}.source-option{min-width:0;border:0;border-radius:6px;padding:0 6px;color:var(--muted);background:transparent;font-weight:700;white-space:nowrap}.source-option:hover{color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,transparent)}.source-option.active{color:#061018;background:linear-gradient(135deg,var(--primary),var(--primary2));box-shadow:0 0 18px color-mix(in srgb,var(--primary) 18%,transparent)}.toolbar-actions{align-self:end;display:flex;gap:8px}.toolbar-actions .mini-btn{min-height:40px}.search-btn{align-self:end;min-height:40px;border:0;border-radius:6px;padding:0 18px;color:#061018;background:linear-gradient(135deg,var(--primary),var(--primary2));font-weight:800}.status{min-height:36px;margin-bottom:14px;padding:10px 12px;border:1px solid color-mix(in srgb,var(--primary) 22%,transparent);border-radius:6px;color:var(--muted);background:color-mix(in srgb,var(--primary) 7%,transparent);font-size:13px}.status.ok{border-color:color-mix(in srgb,var(--success) 32%,transparent);color:var(--success);background:color-mix(in srgb,var(--success) 8%,transparent)}.status.warn{border-color:color-mix(in srgb,var(--warn) 34%,transparent);color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,transparent)}.status.error{border-color:color-mix(in srgb,var(--accent) 34%,transparent);color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}.shell{display:grid;grid-template-columns:minmax(330px,420px) 1fr;gap:16px;align-items:start}.panel{border:1px solid var(--border);border-radius:8px;background:var(--panel);box-shadow:var(--shadow);backdrop-filter:blur(16px);overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:13px 15px;border-bottom:1px solid var(--border)}.panel-head small{color:var(--muted)}.results{display:grid;gap:10px;max-height:calc(100vh - 228px);min-height:560px;padding:12px;overflow:auto}.result-card{display:grid;grid-template-columns:76px 1fr;gap:12px;width:100%;min-height:108px;border:1px solid color-mix(in srgb,var(--primary) 16%,transparent);border-radius:8px;padding:9px;text-align:left;color:inherit;background:rgba(var(--fill),.045);transition:.18s ease}.result-card:hover,.result-card.active{border-color:color-mix(in srgb,var(--primary) 48%,transparent);background:color-mix(in srgb,var(--primary) 9%,transparent);transform:translateY(-1px)}.poster,.poster-fallback{width:76px;height:100px;border-radius:6px}.poster{object-fit:cover;background:rgba(var(--fill),.08)}.poster-fallback{display:grid;place-items:center;border:1px dashed var(--border);color:var(--muted);font-size:12px}.card-copy{min-width:0;display:grid;gap:5px;align-content:start}.title-line{display:flex;align-items:center;gap:8px;min-width:0}.n-tag{flex-shrink:0;min-width:28px;padding:3px 6px;border-radius:5px;color:var(--primary);background:color-mix(in srgb,var(--primary) 11%,transparent);font-size:12px;text-align:center}.name{overflow:hidden;color:var(--text);font-size:14px;font-weight:800;text-overflow:ellipsis;white-space:nowrap}.meta,.desc{color:var(--muted);font-size:12px;line-height:1.5}.desc{display:-webkit-box;overflow:hidden;-webkit-line-clamp:2;-webkit-box-orient:vertical}.viewer{display:grid;gap:14px}.player-panel{display:grid;grid-template-rows:auto auto auto}.player-panel.expanded{position:fixed;inset:0;z-index:100;grid-template-rows:auto minmax(0,1fr) auto;border:0;border-radius:0;background:color-mix(in srgb,var(--panel) 92%,var(--bg));box-shadow:0 22px 90px rgba(0,0,0,.45)}.player-panel.expanded .panel-head{position:relative;z-index:3;padding-right:96px;background:color-mix(in srgb,var(--panel) 96%,#02050a)}.player-panel.expanded #toggleSize{position:fixed;top:12px;right:12px;z-index:1000;min-width:70px;min-height:36px;border-color:var(--primary);color:#061018;background:linear-gradient(135deg,var(--primary),var(--primary2));font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.32)}.player-panel:fullscreen{width:100vw;height:100vh;border:0;border-radius:0;background:#02050a;display:grid;grid-template-rows:auto minmax(0,1fr) auto}.player-panel:fullscreen .stage{height:auto;min-height:0}.player-panel:fullscreen .panel-head,.player-panel:fullscreen .controls{background:color-mix(in srgb,var(--panel) 96%,#02050a)}.player-tools{display:flex;flex-wrap:wrap;gap:8px}.mini-btn{min-height:32px;border:1px solid color-mix(in srgb,var(--primary) 24%,transparent);border-radius:6px;padding:0 10px;color:var(--text);background:rgba(var(--fill),.055)}.mini-btn:hover{border-color:var(--primary);color:var(--primary)}.stage{position:relative;height:min(62vh,680px);min-height:470px;background:#02050a}.player-panel.expanded .stage{height:auto;min-height:0}.stage iframe,.stage video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#02050a}.stage iframe,.stage video{display:none}.stage[data-mode=frame] iframe,.stage[data-mode=video] video{display:block}.player-empty{position:absolute;inset:0;display:grid;place-items:center;padding:28px;color:var(--muted);text-align:center}.stage[data-mode=frame] .player-empty,.stage[data-mode=video] .player-empty{display:none}.controls{display:grid;grid-template-columns:auto minmax(94px,auto) minmax(160px,1fr) minmax(150px,220px) auto auto;gap:10px;align-items:center;padding:12px;border-top:1px solid var(--border);background:rgba(var(--fill),.035)}.range{accent-color:var(--primary);width:100%}.time{color:var(--muted);font:12px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap}.volume{grid-template-columns:auto 1fr;align-items:center;gap:8px}.episode-list{display:flex;flex-wrap:wrap;gap:8px;padding:14px}.episode{min-height:34px;border:1px solid color-mix(in srgb,var(--primary) 22%,transparent);border-radius:6px;padding:0 10px;color:var(--text);background:rgba(var(--fill),.055)}.episode:hover,.episode.active{color:#061018;border-color:transparent;background:var(--primary)}.detail{display:grid;grid-template-columns:132px 1fr;gap:15px;padding:15px}.detail .poster,.detail .poster-fallback{width:132px;height:184px}.detail-copy{display:grid;gap:9px;align-content:start;min-width:0}.detail-title{font-size:22px;line-height:1.25}.tags{display:flex;flex-wrap:wrap;gap:7px}.tag{padding:4px 8px;border:1px solid color-mix(in srgb,var(--primary) 25%,transparent);border-radius:5px;color:var(--primary);background:color-mix(in srgb,var(--primary) 8%,transparent);font-size:12px}.tag.live{color:var(--success);border-color:color-mix(in srgb,var(--success) 34%,transparent);background:color-mix(in srgb,var(--success) 8%,transparent)}.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 34%,transparent);background:color-mix(in srgb,var(--warn) 8%,transparent)}.intro{color:var(--muted);font-size:13px;line-height:1.72}.empty{min-height:260px;display:grid;place-items:center;padding:28px;color:var(--muted);text-align:center}.loading{position:relative;pointer-events:none}.loading:after{content:'';position:absolute;inset:0;border-radius:inherit;background:rgba(5,8,14,.28)}@media(max-width:1080px){main{width:calc(100% - 24px)}.toolbar,.shell{grid-template-columns:1fr}.results{max-height:none;min-height:260px}.stage{min-height:340px;height:52vh}.controls{grid-template-columns:auto auto 1fr}.volume{grid-column:1/-1}.detail{grid-template-columns:110px 1fr}.detail .poster,.detail .poster-fallback{width:110px;height:154px}}@media(max-width:600px){header,.panel-head{align-items:stretch;flex-direction:column}.result-card{grid-template-columns:64px 1fr}.poster,.poster-fallback{width:64px;height:88px}.detail{grid-template-columns:1fr}.detail .poster,.detail .poster-fallback{width:100%;height:260px}.stage{min-height:260px}.controls{grid-template-columns:1fr 1fr}.controls .range,.time,.volume{grid-column:1/-1}.player-panel.expanded{inset:0}}
  </style>
  <style>
    .player-panel{grid-template-rows:auto auto;background:#05080f}
    .player-panel>.panel-head{position:relative;z-index:20;background:color-mix(in srgb,var(--panel) 94%,#05080f)}
    .player-panel.expanded{grid-template-rows:auto minmax(0,1fr)}
    .player-panel.expanded>.panel-head{padding-right:138px}
    .player-panel.expanded #toggleSize{position:static;min-width:38px;min-height:38px;border-color:rgba(255,255,255,.2);color:#fff;background:rgba(255,255,255,.08);box-shadow:none;font-weight:700}
    .player-tools{align-items:center}
    .link-btn{min-height:30px;border:0;border-radius:5px;padding:0 9px;color:var(--muted);background:rgba(var(--fill),.045);font-size:12px}
    .link-btn:hover{color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,transparent)}
    .stage{position:relative;isolation:isolate;width:100%;height:auto;min-height:360px;max-height:min(72vh,760px);aspect-ratio:16/9;overflow:hidden;outline:0;background:#000;cursor:default}
    .player-panel.expanded .stage{width:100%;height:100%;min-height:0;max-height:none;aspect-ratio:auto}
    .player-empty{z-index:2;background:radial-gradient(circle at 50% 42%,rgba(47,107,255,.12),transparent 42%),#03050a}
    @media(max-width:720px){.stage{min-height:280px}.player-panel>.panel-head{align-items:center;flex-direction:row}.player-tools .link-btn{display:none}}
  </style>
</head>
<body>
  <main>
    <header>
      <div class="headline"><h1>xb_dm</h1><p class="sub">搜索动漫后选择结果，播放器在右侧，剧集列表固定在播放器下方。</p></div>
      <span class="badge"><i></i><span id="mode">检测宿主中...</span></span>
    </header>
    <form id="searchForm" class="toolbar">
      <label>API key<input id="apiKey" type="password" placeholder="在妖狐 API 控制台查看" autocomplete="off"></label>
      <label>动漫关键词<input id="keyword" type="search" placeholder="例如：斗罗大陆" value="斗罗大陆" autocomplete="off"></label>
      <label class="source-field">资源站<div id="sourceGroup" class="source-segmented" role="radiogroup" aria-label="资源站"><button class="source-option active" type="button" data-source="1">资源1</button><button class="source-option" type="button" data-source="2">资源2</button><button class="source-option" type="button" data-source="3">资源3</button><button class="source-option" type="button" data-source="4">资源4</button><input id="source" type="hidden" value="1"></div></label>
      <div class="toolbar-actions"><button id="healthBtn" class="mini-btn toolbar-check" type="button">自检</button><button id="searchBtn" class="search-btn" type="button">搜索</button></div>
    </form>
    <div id="status" class="status">等待搜索。插件会通过 Python 后端请求 API。</div>
    <div class="shell">
      <section class="panel"><div class="panel-head"><h2>搜索结果</h2><small id="resultMeta">0 条</small></div><div id="results" class="results"><div class="empty">输入关键词并搜索后，动漫列表会显示在这里。</div></div></section>
      <section class="viewer">
        <section id="playerPanel" class="panel player-panel">
          <div class="panel-head">
            <div><h2 id="playerTitle">播放器</h2><small id="playerHint">选择剧集后播放</small></div>
            <div class="player-tools">
              <button id="copyRaw" class="link-btn" type="button">复制原始</button>
              <button id="copyParser" class="link-btn" type="button">复制解析</button>
          <button id="openPlayer" class="link-btn" type="button" title="打开妖狐播放器">↗ 打开播放器</button>
              <button id="toggleSize" class="link-btn" type="button" title="全屏">⛶ 全屏</button>
            </div>
          </div>
          <div id="stage" class="stage" data-mode="empty" tabindex="0">
            <div id="playerEmpty" class="player-empty">选择剧集后将在宿主播放器窗口中打开。</div>
          </div>
        </section>
        <section class="panel"><div class="panel-head"><h2>剧集</h2><small id="episodeMeta">0 集</small></div><div id="episodes" class="episode-list"><div class="empty">剧集会显示在播放器下方。</div></div></section>
        <section id="detailPanel" class="panel"><div class="empty">选择搜索结果后显示详情。</div></section>
      </section>
    </div>
  </main>  <script>
    const els={mode:document.querySelector('#mode'),form:document.querySelector('#searchForm'),apiKey:document.querySelector('#apiKey'),keyword:document.querySelector('#keyword'),source:document.querySelector('#source'),sourceGroup:document.querySelector('#sourceGroup'),healthBtn:document.querySelector('#healthBtn'),searchBtn:document.querySelector('#searchBtn'),status:document.querySelector('#status'),resultMeta:document.querySelector('#resultMeta'),results:document.querySelector('#results'),playerPanel:document.querySelector('#playerPanel'),toggleSize:document.querySelector('#toggleSize'),stage:document.querySelector('#stage'),playerEmpty:document.querySelector('#playerEmpty'),playerTitle:document.querySelector('#playerTitle'),playerHint:document.querySelector('#playerHint'),copyRaw:document.querySelector('#copyRaw'),copyParser:document.querySelector('#copyParser'),openPlayer:document.querySelector('#openPlayer'),episodes:document.querySelector('#episodes'),episodeMeta:document.querySelector('#episodeMeta'),detailPanel:document.querySelector('#detailPanel')}
    const state={query:'',source:1,items:[],selectedN:null,selectedEpisode:null,lastSearch:null}
    const PREFS_KEY='xb_dm.preferences.v1'
    function host(){return window.XBSVCB||null}
    function sourceName(source){return({1:'资源站1',2:'资源站2',3:'资源站3',4:'资源站4'})[Number(source)]||`资源站${source}`}
    function setSource(value){const next=String(value||1);els.source.value=next;Array.from(els.sourceGroup.querySelectorAll('.source-option')).forEach(btn=>btn.classList.toggle('active',btn.dataset.source===next))}
    function text(value,fallback=''){const result=value===undefined||value===null?'':String(value);return result.trim()||fallback}
    function setStatus(message,type=''){els.status.className=`status ${type}`.trim();els.status.textContent=message}
    function setBusy(value){els.searchBtn.disabled=value;els.searchBtn.textContent=value?'搜索中':'搜索'}
    async function savePrefs(){const prefs={key:els.apiKey.value,keyword:els.keyword.value,source:els.source.value};const api=host();if(api&&api.setStorage){await api.setStorage(PREFS_KEY,prefs);return}try{localStorage.setItem('xbDmPrefs',JSON.stringify(prefs))}catch(_){}}
    async function loadPrefs(){let prefs=null;const api=host();if(api&&api.getStorage){prefs=await api.getStorage(PREFS_KEY,null)}else{try{const raw=localStorage.getItem('xbDmPrefs')||localStorage.getItem('xbAnimeViewerPrefs');if(raw)prefs=JSON.parse(raw)}catch(_){}}if(prefs&&typeof prefs==='object'){if(typeof prefs.key==='string')els.apiKey.value=prefs.key;if(typeof prefs.keyword==='string')els.keyword.value=prefs.keyword;if(prefs.source)els.source.value=String(prefs.source)}setSource(els.source.value)}
    function collectValues(){const key=els.apiKey.value.trim();const msg=els.keyword.value.trim();const source=Number(els.source.value||1);if(!key)throw new Error('请填写 API key');if(!msg)throw new Error('请填写动漫关键词');return{key,msg,source}}
    async function runAction(actionId,values){const api=host();if(!api)throw new Error('当前页面不在 XB-SVCB 插件宿主中运行');return api.runAction(actionId,values)}
    async function loadTheme(){updateMode();const api=host();if(!api||!api.getContext)return;try{const ctx=await api.getContext();const theme=ctx&&ctx.theme?String(ctx.theme):'cyber';document.documentElement.dataset.theme=['anime','custom'].includes(theme)?theme:'cyber'}catch(_){}}
    function updateMode(){els.mode.textContent=host()?'XB-SVCB 宿主模式':'浏览器预览模式'}
    function createPoster(src,alt){if(!src){const fallback=document.createElement('div');fallback.className='poster-fallback';fallback.textContent='无封面';return fallback}const img=document.createElement('img');img.className='poster';img.src=src;img.alt=alt||'动漫封面';img.referrerPolicy='no-referrer';img.addEventListener('error',()=>img.replaceWith(createPoster('',alt)));return img}
    function metaLine(item){return[item.year,item.area,item.type,item.remarks||item.state].filter(Boolean).join(' · ')}
    function renderResults(items){els.resultMeta.textContent=`${items.length} 条`;els.results.replaceChildren();if(!items.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='没有搜索结果，试试换关键词或资源站。';els.results.append(empty);return}for(const item of items){const card=document.createElement('button');card.type='button';card.className='result-card';if(String(item.n)===String(state.selectedN))card.classList.add('active');card.append(createPoster(item.pic,item.name));const copy=document.createElement('div');copy.className='card-copy';const title=document.createElement('div');title.className='title-line';const nTag=document.createElement('span');nTag.className='n-tag';nTag.textContent=`n=${text(item.n,'-')}`;const name=document.createElement('span');name.className='name';name.textContent=item.name;title.append(nTag,name);const meta=document.createElement('div');meta.className='meta';meta.textContent=metaLine(item)||'暂无元信息';const desc=document.createElement('div');desc.className='desc';desc.textContent=item.content||item.subtitle||'暂无简介';copy.append(title,meta,desc);card.append(copy);card.addEventListener('click',()=>loadDetail(item));els.results.append(card)}}
    function addTag(parent,value,cls=''){if(!value)return;const tag=document.createElement('span');tag.className=`tag ${cls}`.trim();tag.textContent=value;parent.append(tag)}
    function renderDetail(detail,source){els.detailPanel.replaceChildren();const wrap=document.createElement('div');wrap.className='detail';wrap.append(createPoster(detail.pic,detail.name));const copy=document.createElement('div');copy.className='detail-copy';const title=document.createElement('h2');title.className='detail-title';title.textContent=detail.name||'未命名动漫';const tags=document.createElement('div');tags.className='tags';addTag(tags,source&&source.name?source.name:sourceName(state.source),'live');addTag(tags,detail.remarks||detail.state,detail.state==='连载中'?'warn':'');addTag(tags,detail.year);addTag(tags,detail.area);addTag(tags,detail.type);addTag(tags,detail.class);addTag(tags,detail.total_episodes?`${detail.total_episodes} 集`:'');const intro=document.createElement('p');intro.className='intro';intro.textContent=detail.content||'暂无简介。';copy.append(title,tags,intro);wrap.append(copy);els.detailPanel.append(wrap)}
    function renderEpisodes(episodes){els.episodeMeta.textContent=`${episodes.length} 集`;els.episodes.replaceChildren();if(!episodes.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='这个结果没有返回剧集播放链接。';els.episodes.append(empty);return}episodes.forEach((episode,index)=>{const btn=document.createElement('button');btn.type='button';btn.className='episode';btn.textContent=episode.title||`第 ${index+1} 集`;btn.addEventListener('click',()=>playEpisode(episode,btn));els.episodes.append(btn)});const first=els.episodes.querySelector('.episode');if(first)playEpisode(episodes[0],first)}
    async function healthCheck(){els.healthBtn.disabled=true;setStatus('正在检查 Python 后端...');try{const result=await runAction('health_check',{});const count=Array.isArray(result.actions)?result.actions.length:0;setStatus(`Python 后端可用：${result.plugin_id}，已注册 ${count} 个动作。`,'ok')}catch(error){setStatus(error instanceof Error?error.message:String(error),'error')}finally{els.healthBtn.disabled=false}}
    async function search(){let values;try{values=collectValues();await savePrefs()}catch(error){setStatus(error instanceof Error?error.message:String(error),'error');return}state.lastSearch={...values};state.query=values.msg;state.source=values.source;state.selectedN=null;state.selectedEpisode=null;resetPlayer();els.detailPanel.innerHTML='<div class="empty">选择搜索结果后显示详情。</div>';els.episodeMeta.textContent='0 集';els.episodes.innerHTML='<div class="empty">剧集会显示在播放器下方。</div>';setBusy(true);setStatus(`正在从 ${sourceName(values.source)} 搜索“${values.msg}”...`);try{const result=await runAction('search_anime',values);state.items=Array.isArray(result.items)?result.items:[];renderResults(state.items);const source=result.source&&result.source.name?result.source.name:sourceName(values.source);setStatus(`搜索完成：${source} 返回 ${state.items.length} 条结果。`,'ok')}catch(error){state.items=[];renderResults([]);setStatus(error instanceof Error?error.message:String(error),'error')}finally{setBusy(false)}}
    async function loadDetail(item){const values=state.lastSearch||collectValues();state.query=values.msg;state.source=values.source;state.selectedN=item.n;renderResults(state.items);resetPlayer();els.detailPanel.innerHTML='<div class="empty">正在读取详情...</div>';els.episodeMeta.textContent='0 集';els.episodes.innerHTML='<div class="empty">正在读取剧集...</div>';setStatus(`正在读取“${item.name}”的播放链接...`);try{const result=await runAction('load_detail',{...values,n:item.n});const detail=result.detail||item;const episodes=Array.isArray(result.episodes)?result.episodes:[];renderDetail(detail,result.source);renderEpisodes(episodes);setStatus(`已读取 ${episodes.length} 个播放链接。`,episodes.length?'ok':'warn')}catch(error){setStatus(error instanceof Error?error.message:String(error),'error');els.detailPanel.innerHTML='<div class="empty">读取详情失败。可以换一个资源站或搜索结果再试。</div>';els.episodes.innerHTML='<div class="empty">剧集读取失败。</div>'}}
    function resetPlayer(){els.playerTitle.textContent="播放器";els.playerHint.textContent="选择剧集后播放";els.playerEmpty.textContent="选择剧集后将在宿主播放器窗口中打开。"}
    function normalizePlayerUrl(value){const url=String(value||"").trim();if(!url)return"";return url.replace(/^http:\/\/m3u8\.yaohud\.cn\//i,"https://m3u8.yaohud.cn/")}
    function playEpisode(episode,button){state.selectedEpisode=episode;Array.from(document.querySelectorAll('.episode')).forEach(node=>node.classList.remove('active'));if(button)button.classList.add('active');const playerUrl=normalizePlayerUrl(episode.m3u8url||'');els.playerTitle.textContent=episode.title||'正在播放';els.playerHint.textContent=playerUrl?'妖狐 M3U8 播放器':'该剧集没有妖狐播放器地址。';els.playerEmpty.textContent=playerUrl?'播放器已在宿主窗口打开，关闭后可通过上方按钮重新进入。':'该剧集没有妖狐播放器地址。';if(!playerUrl){setStatus('该剧集没有返回妖狐播放器地址。','warn');return}setStatus('正在打开妖狐 M3U8 播放器...');openPlayer()}
    async function copyText(value,label){if(!value){setStatus("当前剧集没有"+label+"。","warn");return}try{await navigator.clipboard.writeText(value);setStatus(label+"已复制。","ok")}catch(_){setStatus(label+"："+value,"warn")}}
    async function openPlayer(){
      const playerUrl=normalizePlayerUrl(state.selectedEpisode&&state.selectedEpisode.m3u8url);
      if(!playerUrl){setStatus("当前没有可打开的妖狐播放器地址。","warn");return}
      const api=host();
      if(!api||!api.openYaohuPlayer){setStatus("当前宿主不支持妖狐播放器弹层，请更新宿主后重试。","error");return}
      try{await api.openYaohuPlayer(playerUrl);setStatus("妖狐播放器已打开。","ok")}catch(error){setStatus(error instanceof Error?error.message:String(error),"error")}
    }
    function applyPlayerFullscreen(expanded){els.playerPanel.classList.toggle('expanded',expanded);document.body.classList.toggle('player-expanded',expanded);els.toggleSize.textContent=expanded?'⤢':'⛶';els.toggleSize.title=expanded?'还原':'全屏';els.toggleSize.setAttribute('aria-label',expanded?'还原':'全屏')}
    async function togglePlayerSize(){const expanded=!els.playerPanel.classList.contains('expanded');const api=host();if(!api||!api.togglePluginFullscreen){applyPlayerFullscreen(expanded);return}try{const result=await api.togglePluginFullscreen(expanded);applyPlayerFullscreen(result&&typeof result.fullscreen==='boolean'?result.fullscreen:expanded)}catch(error){setStatus(error instanceof Error?error.message:String(error),'error')}}
    els.form.addEventListener('submit',event=>event.preventDefault())
    els.searchBtn.addEventListener('click',()=>search().catch(error=>setStatus(error instanceof Error?error.message:String(error),'error')))
    ;[els.apiKey,els.keyword].forEach(input=>{input.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();els.searchBtn.click()}});input.addEventListener('change',()=>savePrefs().catch(error=>setStatus(error instanceof Error?error.message:String(error),'error')))})
    Array.from(els.sourceGroup.querySelectorAll('.source-option')).forEach(btn=>btn.addEventListener('click',()=>{setSource(btn.dataset.source);savePrefs().catch(error=>setStatus(error instanceof Error?error.message:String(error),'error'))}))
    els.healthBtn.addEventListener('click',healthCheck)
    els.toggleSize.addEventListener('click',()=>togglePlayerSize().catch(error=>setStatus(error instanceof Error?error.message:String(error),'error')))
    els.copyRaw.addEventListener('click',()=>copyText(state.selectedEpisode&&state.selectedEpisode.url,'原始链接'))
    els.copyParser.addEventListener('click',()=>copyText(normalizePlayerUrl(state.selectedEpisode&&state.selectedEpisode.m3u8url),'解析链接'))
    els.openPlayer.addEventListener('click',()=>openPlayer())
    window.addEventListener('xb-svcb-host-event',event=>{if(event.detail&&event.detail.name==='pluginFullscreenChanged')applyPlayerFullscreen(Boolean(event.detail.payload&&event.detail.payload.fullscreen))})
    window.addEventListener('error',event=>setStatus(event.message||'插件页面脚本错误','error'))
    window.addEventListener('unhandledrejection',event=>setStatus(event.reason instanceof Error?event.reason.message:String(event.reason||'插件异步操作失败'),'error'))
    window.addEventListener('xb-svcb-ready',loadTheme)
    async function bootstrap(){await Promise.all([loadPrefs(),loadTheme()]);setStatus('插件页面脚本已加载，点击剧集后使用妖狐播放器...');setTimeout(()=>{if(host())healthCheck();else setStatus('插件页面脚本已加载，但没有检测到宿主 Bridge。','warn')},120)}
    bootstrap().catch(error=>setStatus(error instanceof Error?error.message:String(error),'error'))
  </script>
</body>
</html>
